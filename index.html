<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala Geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #0E1524;
    --bg-panel: #161F35;
    --bg-header: #121A2E;
    --bubble-received: #212C48;
    --bubble-sent: #F2A65A;
    --text-main: #ECECF1;
    --text-sent: #1A1408;
    --text-muted: #8993AC;
    --accent: #F2A65A;
    --accent-dim: #C98543;
    --online-dot: #6FCF97;
    --divider: #26304B;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg-page);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 460px;
    height: min(720px, 92vh);
    background: var(--bg-panel);
    border-radius: 22px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .header {
    background: var(--bg-header);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }

  .header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    color: var(--text-sent);
    font-size: 16px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }

  .header-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 2px 0;
  }

  .header-sub {
    font-size: 12.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--online-dot);
    box-shadow: 0 0 0 0 rgba(111,207,151,0.6);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(111,207,151,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(111,207,151,0); }
    100% { box-shadow: 0 0 0 0 rgba(111,207,151,0); }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 13.5px;
    line-height: 1.6;
    max-width: 240px;
  }

  .row {
    display: flex;
    margin: 4px 0;
  }

  .row.mine { justify-content: flex-end; }
  .row.theirs { justify-content: flex-start; }

  .bubble-group { max-width: 78%; display: flex; flex-direction: column; }

  .sender-name {
    font-size: 11.5px;
    color: var(--accent);
    margin: 6px 2px 3px 2px;
    font-weight: 600;
  }

  .bubble {
    padding: 9px 13px;
    font-size: 14.5px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .row.theirs .bubble {
    background: var(--bubble-received);
    color: var(--text-main);
    border-radius: 4px 16px 16px 16px;
  }

  .row.mine .bubble {
    background: var(--bubble-sent);
    color: var(--text-sent);
    border-radius: 16px 4px 16px 16px;
  }

  .timestamp {
    font-size: 10.5px;
    color: var(--text-muted);
    margin: 3px 4px 0 4px;
  }

  .row.mine .timestamp { text-align: right; }

  .input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--bg-header);
    border-top: 1px solid var(--divider);
    flex-shrink: 0;
  }

  .input-bar input {
    flex: 1;
    background: var(--bg-panel);
    border: 1px solid var(--divider);
    border-radius: 22px;
    padding: 11px 16px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    outline: none;
  }

  .input-bar input:focus { border-color: var(--accent-dim); }
  .input-bar input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .send-btn:hover { background: var(--accent-dim); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn svg { width: 18px; height: 18px; }

  /* Join overlay */
  .join-overlay {
    position: absolute;
    inset: 0;
    background: rgba(14,21,36,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 32px;
    text-align: center;
    z-index: 10;
  }

  .join-overlay h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 8px 0;
  }

  .join-overlay p {
    color: var(--text-muted);
    font-size: 13.5px;
    margin: 0 0 22px 0;
    max-width: 260px;
    line-height: 1.5;
  }

  .join-overlay input {
    width: 100%;
    max-width: 260px;
    background: var(--bg-panel);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    margin-bottom: 14px;
    text-align: center;
  }

  .join-overlay input:focus { border-color: var(--accent-dim); }

  .join-btn {
    background: var(--accent);
    border: none;
    color: var(--text-sent);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px 28px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .join-btn:hover { background: var(--accent-dim); }

  .status-line {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 6px 0 0 0;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="join-overlay" id="joinOverlay">
    <h2>Entrar na Sala Geral</h2>
    <p>Escolha um nome para participar da conversa. Qualquer pessoa com este link pode entrar.</p>
    <input type="text" id="nameInput" placeholder="Seu nome" maxlength="24" autocomplete="off">
    <button class="join-btn" id="joinBtn">Entrar na conversa</button>
  </div>

  <div class="header">
    <div class="header-avatar">SG</div>
    <div class="header-info">
      <p class="header-title">Sala Geral</p>
      <p class="header-sub"><span class="dot"></span><span id="headerSub">conversa em tempo real</span></p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">Nenhuma mensagem ainda.<br>Seja a primeira pessoa a escrever algo.</div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="Escreva uma mensagem" maxlength="500" autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="#1A1408" stroke-width="1.8" stroke-linejoin="round" fill="#1A1408"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function() {
  const MESSAGES_KEY = 'messages';
  const USERNAME_KEY = 'chat:username';
  const POLL_MS = 2000;

  let username = null;
  let knownIds = new Set();
  let pollTimer = null;

  const joinOverlay = document.getElementById('joinOverlay');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const headerSub = document.getElementById('headerSub');

  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderMessages(list) {
    if (list.length === 0) {
      messagesEl.innerHTML = '';
      messagesEl.appendChild(emptyState);
      return;
    }
    emptyState.remove && emptyState.remove();

    const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;

    messagesEl.innerHTML = '';
    let lastSender = null;
    list.forEach(m => {
      const mine = m.user === username;
      const row = document.createElement('div');
      row.className = 'row ' + (mine ? 'mine' : 'theirs');

      const group = document.createElement('div');
      group.className = 'bubble-group';

      if (!mine && lastSender !== m.user) {
        const nameEl = document.createElement('div');
        nameEl.className = 'sender-name';
        nameEl.textContent = m.user;
        group.appendChild(nameEl);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.text;
      group.appendChild(bubble);

      const time = document.createElement('div');
      time.className = 'timestamp';
      time.textContent = fmtTime(m.ts);
      group.appendChild(time);

      row.appendChild(group);
      messagesEl.appendChild(row);
      lastSender = m.user;
    });

    if (wasNearBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function loadMessages(scrollToBottom) {
    try {
      const result = await window.storage.get(MESSAGES_KEY, true);
      const list = result ? JSON.parse(result.value) : [];
      renderMessages(list);
      if (scrollToBottom) {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      headerSub.textContent = 'conversa em tempo real';
    } catch (err) {
      // key doesn't exist yet — treat as empty
      renderMessages([]);
      headerSub.textContent = 'conversa em tempo real';
    }
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text || !username) return;

    let list = [];
    try {
      const result = await window.storage.get(MESSAGES_KEY, true);
      list = result ? JSON.parse(result.value) : [];
    } catch (err) {
      list = [];
    }

    list.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      user: username,
      text: text,
      ts: Date.now()
    });

    if (list.length > 300) {
      list = list.slice(list.length - 300);
    }

    try {
      await window.storage.set(MESSAGES_KEY, JSON.stringify(list), true);
    } catch (err) {
      console.error('Falha ao enviar mensagem', err);
      return;
    }

    msgInput.value = '';
    renderMessages(list);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => loadMessages(false), POLL_MS);
  }

  async function enterChat(name) {
    username = name;
    joinOverlay.style.display = 'none';

    try {
      await window.storage.set(USERNAME_KEY, name, false);
    } catch (err) {
      // non-critical if this fails
    }

    await loadMessages(true);
    startPolling();
    msgInput.focus();
  }

  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.style.borderColor = '#E0616B';
      nameInput.focus();
      return;
    }
    enterChat(name);
  });

  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinBtn.click();
  });

  sendBtn.addEventListener('click', () => sendMessage(msgInput.value));
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(msgInput.value);
  });

  // Try to prefill remembered username
  (async function init() {
    try {
      const result = await window.storage.get(USERNAME_KEY, false);
      if (result && result.value) {
        nameInput.value = result.value;
      }
    } catch (err) {
      // no saved username yet
    }
  })();
})();
</script>

</body>
</html>
